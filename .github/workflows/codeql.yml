name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      # Port of the JDK used by the regular CI Android job. CodeQL init replaces
      # JAVA_HOME for the traced build, so Gradle no longer sees the runner JDK.
      - name: Install build JDK
        if: matrix.language == 'java-kotlin'
        run: |
          jdk=/usr/lib/jvm/temurin-17-jdk-amd64
          if [ ! -x "$jdk/bin/java" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq temurin-17-jdk
          fi
          echo "JAVA_TOOL_OPTIONS=-Dorg.gradle.java.home=$jdk" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Android client
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
