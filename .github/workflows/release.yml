name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use stable vMAJOR.MINOR.PATCH form (for example v1.5.1)." >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  android:
    name: Verify and sign APK and Play bundle
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode and validate both persistent signing identities
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_PLAY_KEYSTORE_BASE64: ${{ secrets.ANDROID_PLAY_KEYSTORE_BASE64 }}
          ANDROID_PLAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAY_KEYSTORE_PASSWORD }}
          ANDROID_PLAY_KEY_ALIAS: ${{ secrets.ANDROID_PLAY_KEY_ALIAS }}
          ANDROID_PLAY_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Add ANDROID_KEYSTORE_BASE64; see docs/RELEASING.md}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Add ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Add ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Add ANDROID_KEY_PASSWORD}"
          : "${ANDROID_PLAY_KEYSTORE_BASE64:?Add the separate Android Play upload keystore; see docs/PLAY_STORE.md}"
          : "${ANDROID_PLAY_KEYSTORE_PASSWORD:?Add ANDROID_PLAY_KEYSTORE_PASSWORD}"
          : "${ANDROID_PLAY_KEY_ALIAS:?Add ANDROID_PLAY_KEY_ALIAS}"
          : "${ANDROID_PLAY_KEY_PASSWORD:?Add ANDROID_PLAY_KEY_PASSWORD}"
          if [ "$ANDROID_KEYSTORE_BASE64" = "$ANDROID_PLAY_KEYSTORE_BASE64" ]; then
            echo "Do not reuse the GitHub app-signing key as the Play upload key." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nas-watchdog-release.p12"
          printf '%s' "$ANDROID_PLAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nas-watchdog-play-upload.p12"
          chmod 600 "$RUNNER_TEMP/nas-watchdog-release.p12" "$RUNNER_TEMP/nas-watchdog-play-upload.p12"
          keytool -list -keystore "$RUNNER_TEMP/nas-watchdog-release.p12" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          keytool -list -keystore "$RUNNER_TEMP/nas-watchdog-play-upload.p12" \
            -storepass "$ANDROID_PLAY_KEYSTORE_PASSWORD" -alias "$ANDROID_PLAY_KEY_ALIAS" >/dev/null
          {
            printf 'ANDROID_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/nas-watchdog-release.p12"
            printf 'ANDROID_PLAY_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/nas-watchdog-play-upload.p12"
          } >> "$GITHUB_ENV"
      - name: Test and build signed distribution artifacts
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_PLAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PLAY_KEYSTORE_PASSWORD }}
          ANDROID_PLAY_KEY_ALIAS: ${{ secrets.ANDROID_PLAY_KEY_ALIAS }}
          ANDROID_PLAY_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_KEY_PASSWORD }}
        run: |
          version_code=$((GITHUB_RUN_NUMBER + 1000))
          ./gradlew --no-daemon \
            -PreleaseVersionCode="$version_code" \
            -PreleaseVersionName="$RELEASE_VERSION" \
            testReleaseUnitTest lintRelease assembleRelease \
            testPlayUnitTest lintPlay bundlePlay
      - name: Download checksum-pinned bundle validator
        env:
          BUNDLETOOL_VERSION: 1.18.2
          BUNDLETOOL_SHA256: ${{ vars.BUNDLETOOL_SHA256 }}
        run: |
          : "${BUNDLETOOL_SHA256:?Add BUNDLETOOL_SHA256 for the pinned bundletool release; see docs/RELEASING.md}"
          curl -fsSL --retry 3 \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            -o "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Verify signatures, package/version, and stage assets
        env:
          APK_NAME: nas-watchdog-${{ needs.prepare.outputs.version }}-android.apk
          AAB_NAME: nas-watchdog-${{ needs.prepare.outputs.version }}-play.aab
          VERSION_CODE: ${{ github.run_number }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/play/app-play.aab
          test -f "$apk"
          test -f "$aab"
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner_bin"
          "$apksigner_bin" verify "$apk"
          jarsigner -verify "$aab"
          expected_code=$((VERSION_CODE + 1000))
          export EXPECTED_PACKAGE=com.grey.naswatchdog EXPECTED_VERSION_CODE="$expected_code"
          export EXPECTED_VERSION_NAME=${{ toJSON(needs.prepare.outputs.version) }}
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$aab"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$aab" > "$RUNNER_TEMP/bundle-manifest.xml"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse(os.environ['RUNNER_TEMP'] + '/bundle-manifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package'] == os.environ['EXPECTED_PACKAGE']
          assert root.attrib[android + 'versionCode'] == os.environ['EXPECTED_VERSION_CODE']
          assert root.attrib[android + 'versionName'] == os.environ['EXPECTED_VERSION_NAME']
          print('Bundle package and version metadata match the release tag/run.')
          PY
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$apk" "$RUNNER_TEMP/release-assets/$APK_NAME"
          cp "$aab" "$RUNNER_TEMP/release-assets/$AAB_NAME"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum "$APK_NAME" "$AAB_NAME" > SHA256SUMS.txt
      - name: Upload signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: nas-watchdog-release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Publish GHCR container
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: watchdog/package-lock.json
      - name: Test collector and dashboard source
        working-directory: watchdog
        run: |
          go test -race -count=1 ./...
          npm ci
          npm run check
          npm test
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push versioned AMD64 image
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # GHCR namespace/repository paths must be lowercase.
          image=$(printf '%s' "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          printf 'CONTAINER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "VERSION=$RELEASE_VERSION" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$RELEASE_VERSION" \
            --tag "$image:latest" \
            --push \
            ./watchdog
      - name: Verify published registry image
        run: docker buildx imagetools inspect "$CONTAINER_IMAGE:$RELEASE_VERSION"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  publish:
    name: Publish GitHub Release
    needs:
      - android
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK, Play AAB, and checksums
        uses: actions/download-artifact@v8
        with:
          name: nas-watchdog-release-assets
          path: ${{ runner.temp }}/release-assets/
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "${RUNNER_TEMP}/release-assets/"* \
            --verify-tag \
            --title "NAS Watchdog $TAG" \
            --generate-notes
