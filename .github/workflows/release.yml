name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use stable vMAJOR.MINOR.PATCH form (for example v1.4.0)." >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  android:
    name: Sign Android release APK
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Add the ANDROID_KEYSTORE_BASE64 repository secret; see docs/RELEASING.md}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Add the ANDROID_KEYSTORE_PASSWORD repository secret}"
          : "${ANDROID_KEY_ALIAS:?Add the ANDROID_KEY_ALIAS repository secret}"
          : "${ANDROID_KEY_PASSWORD:?Add the ANDROID_KEY_PASSWORD repository secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nas-watchdog-release.p12"
          chmod 600 "$RUNNER_TEMP/nas-watchdog-release.p12"
          keytool -list -keystore "$RUNNER_TEMP/nas-watchdog-release.p12" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/nas-watchdog-release.p12" >> "$GITHUB_ENV"
      - name: Test, sign, and assemble
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version_code=$((GITHUB_RUN_NUMBER + 1000))
          ./gradlew --no-daemon \
            -PreleaseVersionCode="$version_code" \
            -PreleaseVersionName="$RELEASE_VERSION" \
            testReleaseUnitTest lintRelease assembleRelease
      - name: Verify and stage release assets
        env:
          APK_NAME: nas-watchdog-${{ needs.prepare.outputs.version }}-android.apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner_bin"
          "$apksigner_bin" verify "$apk"
          mkdir -p "$RUNNER_TEMP/release-assets"
          cp "$apk" "$RUNNER_TEMP/release-assets/$APK_NAME"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum "$APK_NAME" > SHA256SUMS.txt
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: nas-watchdog-release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Publish GHCR container
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: false
      - name: Test collector
        working-directory: watchdog
        run: go test -race -count=1 ./...
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push versioned AMD64 image
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # GHCR namespace/repository paths must be lowercase.
          image=$(printf '%s' "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          printf 'CONTAINER_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "VERSION=$RELEASE_VERSION" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$RELEASE_VERSION" \
            --tag "$image:latest" \
            --push \
            ./watchdog
      - name: Verify published registry image
        run: docker buildx imagetools inspect "$CONTAINER_IMAGE:$RELEASE_VERSION"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  publish:
    name: Publish GitHub Release
    needs:
      - android
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK and checksums
        uses: actions/download-artifact@v4
        with:
          name: nas-watchdog-release-assets
          path: ${{ runner.temp }}/release-assets/
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "${RUNNER_TEMP}/release-assets/"* \
            --verify-tag \
            --title "NAS Watchdog $TAG" \
            --generate-notes
