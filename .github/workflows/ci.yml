name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  watchdog:
    name: Go collector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: false
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...

  docker:
    name: Docker and Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret validation configuration
        run: |
          cp watchdog/.env.example watchdog/.env
          sed -i 's/^WD_API_TOKEN=$/WD_API_TOKEN=ci-validation-only/' watchdog/.env
      - name: Validate Compose model
        run: docker compose -f watchdog/docker-compose.yml config --quiet
      - name: Build AMD64 image
        run: docker build --platform linux/amd64 --tag nas-watchdog:ci ./watchdog

  android:
    name: Android tests, lint, and APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nas-watchdog-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
